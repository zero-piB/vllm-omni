# MiniCPM-o 4.5 three-stage deploy on one large-memory GPU.
pipeline: minicpmo_4_5
async_chunk: true

trust_remote_code: true
enable_prefix_caching: false

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      connector_get_sleep_s: 0.01
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 15
      initial_codec_chunk_frames: 8
      token2wav_n_timesteps: 2
      codec_left_context_frames: 3

stages:
  - stage_id: 0
    # Four-way concurrency matches the single-GPU memory shares below;
    # larger batches make Code2Wav activations OOM on one H100.
    max_num_seqs: 4
    # Leave headroom on the shared GPU for Talker KV + concurrent Code2Wav.
    gpu_memory_utilization: 0.55
    enforce_eager: false
    # C63 (2026-08-18): TP=2 双 die 并行（910C 1 NPU × 2 Chip, HCCS 数据面）。
    # 实测 TTFT -19% / TTFP -11% / RTF -15% vs 单卡 champion；精度零劣化。
    tensor_parallel_size: 2
    max_num_batched_tokens: 16384
    max_model_len: 32768
    devices: "0,1"
    # Required for MiniCPM interleaved image/audio Daily-Omni packs (~78% recipe).
    # Keep these in YAML so they survive both --deploy-config and --stage-configs-path.
    interleave_mm_strings: true
    media_io_kwargs:
      video:
        fps: 1
        num_frames: 128
    limit_mm_per_prompt:
      # Daily-Omni MiniCPM pack ≤64 pairs (1fps); VideoMME minicpm-frames pack ≤96 帧（官方要求 ≥96）。
      image: 96
      audio: 64
      video: 1
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      detokenize: true
      # 1.0 for MCQ accuracy; 1.1 can bias short A–D answers.
      repetition_penalty: 1.0

  - stage_id: 1
    max_num_seqs: 4
    gpu_memory_utilization: 0.15
    enforce_eager: false
    max_num_batched_tokens: 8192
    # Talker context is 4096 (tts_config.max_position_embeddings).
    max_model_len: 4096
    devices: "0"
    output_connectors:
      to_stage_2: connector_of_shared_memory
    # Codec sampling comes from the checkpoint's tts_config. These parameters
    # govern only vLLM's binary continue/stop token.
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      min_tokens: 50
      max_tokens: 2048
      stop_token_ids: [1]
      seed: 42
      detokenize: false

  - stage_id: 2
    max_num_seqs: 4
    gpu_memory_utilization: 0.18
    enforce_eager: true
    enable_chunked_prefill: false
    max_num_batched_tokens: 65536
    max_model_len: 65536
    # C63: stage0 TP=2 占用双 die 后，stage2 挪到 die1（与 stage0-r1 同卡，4G 显存）。
    devices: "1"
    input_connectors:
      from_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 65536
      detokenize: true

platforms:
  npu:
    stages:
      - stage_id: 0
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: FULL_AND_PIECEWISE
      - stage_id: 1
        max_num_batched_tokens: 8192
        compilation_config:
          cudagraph_mode: FULL_AND_PIECEWISE
